name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: |
          flutter test \
            --dart-define=API_BASE_URL=http://127.0.0.1:41899/v1

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=http://192.168.1.66:3000/v1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: technican-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
